  const [{ goals: G }, { assessments }] = await Promise.all([api("GET", "/api/goals"), api("GET", "/api/assessments")]);
  const top = assessments[0] ? assessments[0].result.top_gaps : [];
  const today = new Date().toISOString().slice(0, 10);
  const comps = [...new Set([...top, ...G.map((g) => g.competency || "general")])];
  const groups = comps.map((c) => ({ c, items: G.filter((g) => (g.competency || "general") === c) }));
  const total = G.length, done = G.filter((g) => g.status === "done").length, fromSessions = G.filter((g) => g.source).length;
  const overdue = G.filter((g) => g.status !== "done" && g.due && g.due < today).length;
  view().innerHTML = `
  <section class="panel">
    <h2>Goals</h2>
    <p class="muted">Action items from your mentor sessions and your own goals, grouped by the gap they close. In progress counts as half done.</p>
    <div class="summary">
      <div class="stat"><span class="eyebrow">Overall</span><strong>${goalPct(G)}%</strong></div>
      <div class="stat"><span class="eyebrow">Done</span><strong>${done} of ${total}</strong></div>
      <div class="stat"><span class="eyebrow">From mentor sessions</span><strong>${fromSessions}</strong></div>
      <div class="stat"><span class="eyebrow">Overdue</span><strong class="${overdue ? "overdue-n" : ""}">${overdue}</strong></div>
    </div>
    <div class="gap-progress">${groups.map(({ c, items }) => `<div class="gp-row">
      <span class="gp-name">${esc(c === "general" ? "General" : compName(c))}${top.includes(c) ? ` <span class="pill gap1">Top gap</span>` : ""}</span>
      <div class="progress" role="img" aria-label="${goalPct(items)}% complete"><i style="width:${goalPct(items)}%"></i></div>
      <span class="gp-num">${items.length ? `${goalPct(items)}% · ${items.filter((g) => g.status === "done").length} of ${items.length}` : "No goals yet"}</span>
    </div>`).join("")}</div>
  </section>
  ${groups.filter((g) => g.items.length).map(({ c, items }) => `<section class="panel">
    <h3>${esc(c === "general" ? "General" : compName(c))}</h3>
    <div class="goal-list">${items.map((g) => `<div class="goal ${g.status}">
      <div class="goal-main">
        <p>${esc(g.text)}</p>
        <span class="muted goal-src">${g.source ? `From your session with <a href="#sessions">${esc(g.source.mentor_name)}</a> · ${fmtDate(g.source.date)}` : `Your own goal · added ${fmtDate(g.created_at)}`}${g.status === "done" && g.done_at ? ` · done ${fmtDate(g.done_at)}` : ""}</span>
      </div>
      <div class="goal-ctl">
        <label class="sr" for="due-${g.id}">Due date</label>
        <input type="date" id="due-${g.id}" data-due="${g.id}" value="${g.due || ""}" class="${g.status !== "done" && g.due && g.due < today ? "late" : ""}">
        <label class="sr" for="st-${g.id}">Status</label>
        <select id="st-${g.id}" data-st="${g.id}" class="st ${g.status}">${Object.entries(STATUS_LABEL).map(([k, l]) => `<option value="${k}" ${k === g.status ? "selected" : ""}>${l}</option>`).join("")}</select>
      </div>
    </div>`).join("")}</div>
  </section>`).join("")}
  ${!total ? `<p class="empty">No goals yet. After a mentor session, add notes and action items on the <a href="#sessions">Sessions</a> page and choose "Track as goal", or add one below.</p>` : ""}
  <section class="panel">
    <h3>Add your own goal</h3>
    <form class="form" id="goal-new">
      <div class="ai-row wide">
        <input type="text" name="text" placeholder="For example: present my area's strategy at the next planning review" aria-label="Goal" required>
        <select name="competency" aria-label="Gap">${S.meta.competencies.map((c) => `<option value="${c.id}" ${c.id === top[0] ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <input type="date" name="due" min="${today}" aria-label="Due date">
      </div>
      <div class="err"></div>
      <div class="actions"><button class="btn sm">Add goal</button></div>
    </form>
  </section>`;
  $$("[data-st]").forEach((el) => (el.onchange = async () => { await api("PATCH", `/api/goals/${el.dataset.st}`, { status: el.value }); goals(); }));
  $$("[data-due]").forEach((el) => (el.onchange = async () => { await api("PATCH", `/api/goals/${el.dataset.due}`, { due: el.value }); goals(); }));
  $("#goal-new").onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try { await api("POST", "/api/goals", f); goals(); } catch (err) { $("#goal-new .err").textContent = err.message; }
  };
}

// ---------------------------------------------------------------- mentee: profile
async function profile() {
  await refreshMe();
  const p = S.profile;
  view().innerHTML = `<section class="panel"><h2>Your profile</h2>
    <p class="muted">This shapes your matches and is shared with mentors you send a request to.</p>
    <form class="form" id="pf">
      <label class="f">Name<input type="text" name="name" value="${esc(S.me.name)}"></label>
      <div class="grid2">
        <label class="f">Current role<input type="text" name="headline" value="${esc(p.headline)}" placeholder="Senior Product Manager"></label>
        <label class="f">Years of experience<input type="number" min="0" max="60" name="years_exp" value="${p.years_exp || 0}"></label>
      </div>
      <label class="f">Company (type and tenure)<input type="text" name="current_company" value="${esc(p.current_company)}"></label>
      <label class="f">Your goal, in your words<input type="text" name="goal" value="${esc(p.goal)}" placeholder="Head of Product in 3 to 5 years"></label>
      <div class="grid2">
        <label class="f">Career move you're aiming for<select name="goal_move"><option value="">Not sure yet</option>${S.meta.moves.map((m) => `<option value="${m.id}" ${m.id === p.goal_move ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
        <label class="f">Target company profile<select name="target_profile">${S.meta.profiles.map((x) => `<option value="${x.id}" ${x.id === p.target_profile ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      </div>
      <label class="f">What's going on (optional)<textarea name="context">${esc(p.context)}</textarea></label>
      <div class="err" id="pf-err"></div><div class="ok-msg" id="pf-ok"></div>
      <div class="actions"><button class="btn">Save profile</button></div>
    </form></section>`;
  $("#pf").onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.years_exp = +f.years_exp || 0;
    const first = !S.profile.headline;
    try { const r = await api("PUT", "/api/profile", f); S.me = r.user; S.profile = r.profile; renderTopbar(); $("#pf-err").textContent = ""; $("#pf-ok").textContent = "Saved."; if (first) location.hash = "#assess"; }
    catch (err) { $("#pf-err").textContent = err.message; }
  };
}

// ---------------------------------------------------------------- mentor: inbox
async function inbox() {
  const [{ requests }] = await Promise.all([api("GET", "/api/requests"), refreshMe()]);
  const pending = requests.filter((r) => r.status === "pending"), booked = requests.filter((r) => r.status === "accepted"), past = requests.filter((r) => !["pending", "accepted"].includes(r.status));
  const m = S.profile;
  const gapsHtml = (r) => r.mentee_gaps && r.mentee_gaps.length ? `<div><span class="eyebrow">Their top gaps</span><div class="chips" style="margin-top:4px">${r.mentee_gaps.map((g) => `<span class="chip ${m.strengths.includes(g.id) ? "hit" : ""}">${esc(g.name)} ${g.cur}→${g.tgt}</span>`).join("")}</div></div>` : "";
  view().innerHTML = `
  <section class="panel">
    <h2>Session requests</h2>
    <p class="muted">${m.open_slots} of ${m.monthly_capacity} slots open this month. Highlighted gaps are ones you listed as strengths. <a href="#mentor-profile">Edit capacity</a></p>
    ${pending.length ? `<div class="grid2">${pending.map((r) => `<div class="card" data-card="${r.id}">
      <div class="mentor-head"><span class="mini" aria-hidden="true">${initials(r.other_name)}</span><div><strong>${esc(r.other_name)}</strong><br><span class="muted" style="font-size:.85rem">${esc(r.other_headline || "")}${r.mentee_years ? ` · ${r.mentee_years} yrs` : ""}</span></div><span class="status pending" style="margin-left:auto">pending</span></div>
      ${r.mentee_goal ? `<p style="font-size:.85rem"><strong>Goal:</strong> ${esc(r.mentee_goal)}</p>` : ""}
      <p class="muted" style="font-size:.8rem">Topic: ${esc(compName(r.competency))} · sent ${fmtDate(r.created_at)}</p>
      <p style="font-size:.9rem">${esc(r.message)}</p>
      ${gapsHtml(r)}
      <form class="form" data-f="${r.id}">
        <label class="f">Proposed time<input type="text" name="proposed_time" placeholder="Saturday 11:00 IST"></label>
        <label class="f">Note to them<input type="text" name="note" placeholder="Bring your one-page strategy draft"></label>
        <div class="err"></div>
        <div class="actions"><button class="btn sm" data-do="accept">Accept</button><button class="btn danger sm" data-do="decline">Decline</button></div>
      </form></div>`).join("")}</div>` : `<p class="empty">No new requests yet. When a mentee whose top gaps match your strengths asks for a session, it shows up here with their goal and gap view.</p>`}
  </section>
  <section class="panel"><h2>Booked</h2>${booked.length ? `<div class="session-list">${booked.map((r) => requestRow(r, "mentor")).join("")}</div>` : `<p class="empty">No sessions booked yet.</p>`}</section>
  ${past.length ? `<section class="panel"><h2>Past</h2><div class="session-list">${past.map((r) => requestRow(r, "mentor")).join("")}</div></section>` : ""}`;
  $$("[data-f]").forEach((f) => $$("[data-do]", f).forEach((b) => (b.onclick = async (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(f));
    try { await api("POST", `/api/requests/${f.dataset.f}/${b.dataset.do}`, d); inbox(); }
    catch (err) { $(".err", f).textContent = err.message; }
  })));
  bindRequestActions(inbox);
  bindSessionNotes(inbox);
}

async function mentorProfile() {
  await refreshMe();
  const m = S.profile;
  view().innerHTML = `<section class="panel"><h2>Your mentor profile</h2>
    <p class="muted">Mentees are matched to you when your strengths line up with their biggest gaps, and when you've made the move they want.</p>
    <form class="form" id="mf">
      <label class="f">Name<input type="text" name="name" value="${esc(S.me.name)}"></label>
      <div class="grid2">
        <label class="f">Role and company type<input type="text" name="headline" value="${esc(m.headline)}" placeholder="VP Product, enterprise SaaS"></label>
        <label class="f">Years of experience<input type="number" min="0" max="60" name="years_exp" value="${m.years_exp || 0}"></label>
      </div>
      <label class="f">Short bio<textarea name="bio">${esc(m.bio)}</textarea></label>
      <label class="f">Why I mentor (shown to mentees)<textarea name="why" placeholder="One or two sentences in your own words">${esc(m.why || "")}</textarea></label>
      <fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow" style="margin-bottom:6px">Competencies you're strong in</legend>
        <div class="checks">${S.meta.competencies.map((c) => `<label><input type="checkbox" name="strengths" value="${c.id}" ${m.strengths.includes(c.id) ? "checked" : ""}> ${esc(c.name)}</label>`).join("")}</div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow" style="margin-bottom:6px">Career moves you've made</legend>
        <div class="checks">${S.meta.moves.map((x) => `<label><input type="checkbox" name="moves" value="${x.id}" ${m.moves.includes(x.id) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}</div></fieldset>
      <div class="grid2">
        <label class="f">Sessions per month<input type="number" min="0" max="20" name="monthly_capacity" value="${m.monthly_capacity}"></label>
        <label class="f">When you're usually free<input type="text" name="availability" value="${esc(m.availability)}" placeholder="Weekday evenings"></label>
      </div>
      <div class="err" id="mf-err"></div><div class="ok-msg" id="mf-ok"></div>
      <div class="actions"><button class="btn">Save profile</button></div>
    </form></section>`;
  $("#mf").onsubmit = async (e) => {
    e.preventDefault(); const fd = new FormData(e.target);
    const body = { name: fd.get("name"), headline: fd.get("headline"), bio: fd.get("bio"), why: fd.get("why"), years_exp: +fd.get("years_exp") || 0,
      strengths: fd.getAll("strengths"), moves: fd.getAll("moves"), monthly_capacity: +fd.get("monthly_capacity") || 0, availability: fd.get("availability") };
    const first = !S.profile.headline;
    try { const r = await api("PUT", "/api/profile", body); S.me = r.user; S.profile = r.profile; renderTopbar(); $("#mf-err").textContent = ""; $("#mf-ok").textContent = "Saved."; if (first) location.hash = "#inbox"; }
    catch (err) { $("#mf-err").textContent = err.message; }
  };
}

// ---------------------------------------------------------------- boot
(async function boot() {
  try {
    [S.meta] = await Promise.all([api("GET", "/api/meta"), refreshMe()]);
  } catch (e) { view().innerHTML = `<p class="empty">Can't reach the server: ${esc(e.message)}</p>`; return; }
  window.addEventListener("hashchange", router);
  router();
})();

</script>
</body>
</html>
